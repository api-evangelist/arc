aid: arc
name: Arc
description: Arc (arc.dev, formerly CodementorX, and sister to the Codementor mentorship
  marketplace) is a remote talent marketplace that connects companies with vetted freelance
  and full-time software developers, designers, marketers, and product managers across
  190 countries. Arc screens applicants down to roughly the top 2%, and partners with
  Deel and Remote for cross-border payroll and compliance. Arc operates as a hiring
  platform and does not publish a public developer API, OpenAPI specification, SDKs,
  or webhook surface.
